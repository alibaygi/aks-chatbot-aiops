# ── Postgres secret ───────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secrets.postgres.password must be set. See values-secrets.yaml.example." .Values.secrets.postgres.password | quote }}

---
# ── Backend secret ────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  SECRET_KEY: {{ required "secrets.backend.secretKey must be set. See values-secrets.yaml.example." .Values.secrets.backend.secretKey | quote }}
  OPENAI_API_KEY: {{ required "secrets.backend.openaiApiKey must be set. See values-secrets.yaml.example." .Values.secrets.backend.openaiApiKey | quote }}
  TAVILY_API_KEY: {{ required "secrets.backend.tavilyApiKey must be set. See values-secrets.yaml.example." .Values.secrets.backend.tavilyApiKey | quote }}  LANGSMITH_API_KEY: {{ .Values.secrets.backend.langsmithApiKey | default "" | quote }}