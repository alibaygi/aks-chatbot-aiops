# agentops.yaml
# -------------
# Thresholds and configuration for the evaluation gate used in CI/CD.
# This file is read by evaluation/run_eval.py.
#
# All metric scores are in the range [0.0, 1.0].
# A CI build fails (exit code 2) if any metric mean is below its threshold.

evaluation:
  # LangSmith dataset to evaluate against
  dataset: "aks-chatbot-golden-v1"

  # Per-metric pass thresholds (mean score across the dataset)
  thresholds:
    correctness:   0.80   # ≥ 80 % of answers must be factually correct
    relevance:     0.85   # ≥ 85 % of answers must be on-topic and relevant
    groundedness:  0.75   # ≥ 75 % of answers must be grounded in context

# Guardrail thresholds (separate from the eval gate — used for monitoring alerts)
guardrails:
  pii_safe:        1.00   # All responses must be PII-free
  injection_safe:  1.00   # No prompt injection in inputs
  on_topic:        0.90   # ≥ 90 % of responses must be on-topic
