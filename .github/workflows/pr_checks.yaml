# .github/workflows/pr_checks.yaml
# ---------------------------------
# Runs on every pull request targeting main.
# Jobs: lint-backend, typecheck-frontend, test-backend

name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    name: Lint Backend (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install --quiet ruff

      - name: Check formatting
        run: ruff format --check backend/

      - name: Check linting
        run: ruff check backend/

  typecheck-frontend:
    name: Typecheck Frontend (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build (type-checks as a side effect)
        run: cd frontend && npm run build

  test-backend:
    name: Test Backend (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       chatbot_test
          POSTGRES_USER:     chatbot
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatbot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL:     "postgresql+asyncpg://chatbot:testpassword@localhost:5432/chatbot_test"
      LANGGRAPH_DB_URL: "postgresql://chatbot:testpassword@localhost:5432/chatbot_test?sslmode=disable"
      SECRET_KEY:       "test-secret-key-32-chars-xxxxxxxxxx"
      OPENAI_API_KEY:   ${{ secrets.OPENAI_API_KEY }}
      TAVILY_API_KEY:   "dummy"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install --quiet uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short --junitxml=junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: junit.xml
