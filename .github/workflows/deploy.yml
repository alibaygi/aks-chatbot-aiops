name: Build and Deploy to AKS

on:
  push:
    branches:
      - main

permissions:
  id-token: write   # required for OIDC token exchange
  contents: write   # required to push the version-bump commit

env:
  ACR_REGISTRY: akscontainerregistrydev.azurecr.io
  ACR_NAME: akscontainerregistrydev
  AKS_CLUSTER: aksclusterdev
  RESOURCE_GROUP: rg-gen-project
  HELM_RELEASE: chatbot
  HELM_CHART: k8s/aks/chart

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      # ── 2. Increment version ───────────────────────────────────────────────
      # Reads VERSION, bumps the patch number, syncs pyproject.toml and
      # frontend/package.json. The final image tag is <version>-<run_number>
      # (e.g. 0.1.3-42) so every build is uniquely traceable.
      - name: Increment patch version
        id: version
        run: |
          current=$(cat VERSION)
          IFS='.' read -r major minor patch <<< "$current"
          patch=$((patch + 1))
          new_version="${major}.${minor}.${patch}"
          echo "$new_version" > VERSION

          # Sync pyproject.toml
          sed -i "s/^version = \".*\"/version = \"${new_version}\"/" pyproject.toml

          # Sync frontend/package.json
          sed -i "s/\"version\": \".*\"/\"version\": \"${new_version}\"/" frontend/package.json

          image_tag="${new_version}-${{ github.run_number }}"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "Bumped version: ${current} → ${new_version}, image tag: ${image_tag}"

      # ── 3. Evaluation gate (AIOps) ────────────────────────────────────────
      # Runs LLM-as-judge scoring against the golden dataset before anything
      # is built or deployed. If any metric is below its threshold in
      # agentops.yaml, run_eval.py exits with code 2 and the pipeline stops.
      #
      # The gate is OFF by default so the pipeline works without a LangSmith
      # account. To enable it:
      #   1. Add LANGSMITH_API_KEY and OPENAI_API_KEY as GitHub Secrets.
      #   2. Create a repository variable RUN_EVAL_GATE = true
      #      (GitHub → Settings → Variables → Actions → New repository variable).
      - name: Set up Python for evaluation gate
        if: vars.RUN_EVAL_GATE == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run evaluation gate
        if: vars.RUN_EVAL_GATE == 'true'
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          LANGSMITH_PROJECT: aks-chatbot
        run: |
          pip install --quiet uv
          uv pip install --system -e ".[dev]"
          python evaluation/run_eval.py --config agentops.yaml --output results.json

      - name: Upload evaluation results
        if: vars.RUN_EVAL_GATE == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results.json

      # ── 4. Azure login (OIDC — no long-lived secrets) ─────────────────────
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── 5. Build & push backend image via ACR Tasks ───────────────────────
      # az acr build runs the Docker build inside Azure — no Docker daemon
      # needed on the runner, and no registry credentials to manage.
      - name: Build and push backend image
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image chatbot/backend:${{ steps.version.outputs.image_tag }} \
            --file backend/Dockerfile \
            .

      # ── 6. Build & push frontend image via ACR Tasks ──────────────────────
      - name: Build and push frontend image
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image chatbot/frontend:${{ steps.version.outputs.image_tag }} \
            --context ./frontend \
            --file frontend/Dockerfile \
            ./frontend

      # ── 7. Set AKS context ─────────────────────────────────────────────────
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --overwrite-existing

      # ── 8. Deploy with Helm ────────────────────────────────────────────────
      # HELM_VALUES_SECRETS is the full contents of values-secrets.yaml stored
      # as a multiline GitHub Secret. It is written to a temp file that is
      # removed immediately after the helm command exits.
      - name: Helm upgrade
        env:
          HELM_VALUES_SECRETS: ${{ secrets.HELM_VALUES_SECRETS }}
        run: |
          secrets_file=$(mktemp)
          echo "$HELM_VALUES_SECRETS" > "$secrets_file"

          helm upgrade --install ${{ env.HELM_RELEASE }} ${{ env.HELM_CHART }} \
            -f "$secrets_file" \
            --set backend.image.tag=${{ steps.version.outputs.image_tag }} \
            --set frontend.image.tag=${{ steps.version.outputs.image_tag }} \
            --wait --timeout 5m

          rm -f "$secrets_file"

      # ── 9. Commit version bump ─────────────────────────────────────────────
      # [skip ci] prevents this commit from triggering another workflow run.
      - name: Commit and push version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION pyproject.toml frontend/package.json
          git commit -m "ci: bump version to ${{ steps.version.outputs.new_version }} [skip ci]"
          git push origin main
