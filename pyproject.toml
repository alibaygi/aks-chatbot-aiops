[project]
name = "chatbot-on-aks"
version = "0.1.2"
description = "LangGraph-based chatbot with long-term memory"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.2.14",
    "langchain-openai>=1.1.12",
    "langgraph-checkpoint-postgres>=3.0.5",
    "psycopg[binary]>=3.3.3",
    "tavily-python>=0.7.23",
    # API
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database (async SQLAlchemy for app tables: users, conversations, documents)
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    # Vector store (pgvector extension wrapper)
    "pgvector>=0.3.0",
    # Document ingestion
    "pypdf>=5.0.0",
    "langchain-text-splitters>=0.3.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    # Config
    "pydantic-settings>=2.0.0",
    "pydantic[email]>=2.0.0",
    # Observability & evaluation
    "langsmith>=0.2.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Structured logging
    "python-json-logger>=3.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.9.0",
]
